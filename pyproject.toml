[project]
name = "conveyor-motor-speed-control"
version = "0.1.0"
description = "Conveyor motor speed control in PyBullet: bang-bang, PWM and PID with a command-line dashboard"
requires-python = ">=3.10"
dependencies = ["pybullet>=3.2.6"]

[project.scripts]
conveyor = "conveyor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conveyor"]
